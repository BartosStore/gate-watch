openapi: 3.1.0
info:
  title: Kontrola webů obchodníků
  version: "2.0"
  description: |
    Standard API služby. Tyto tři operace zachovejte beze změny.
    Další endpointy můžete přidat. Každý zdokumentujte zde včetně toho, co dělá a proč je potřeba.
    API poslouchá na portu 8080 a používá stejnou logiku a data jako aplikace.
servers:
  - url: http://localhost:8080

paths:
  /runs:
    post:
      summary: Spustí kontrolu seznamu obchodníků
      description: Kontrola běží na pozadí, odpověď přijde hned (do 5 s).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [merchants]
              properties:
                merchants:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [id, url]
                    properties:
                      id: { type: string, description: Stabilní ID obchodu napříč kontrolami }
                      url: { type: string, format: uri, description: Úvodní stránka e-shopu }
            example:
              merchants: [{ id: "shop-1", url: "https://www.example-shop.cz/" }]
      responses:
        "202":
          description: Kontrola založena
          content:
            application/json:
              schema:
                type: object
                required: [run_id]
                properties:
                  run_id: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "503":
          description: Aplikace ještě připravuje blacklist, kontrola se nezaložila
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /runs/{run_id}:
    get:
      summary: Průběh a výsledky kontroly
      parameters:
        - { name: run_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Stav kontroly a výsledky obchodů
          content:
            application/json:
              schema:
                type: object
                required: [run_id, status, results, error]
                properties:
                  run_id: { type: string }
                  status:
                    type: string
                    enum: [running, done, failed]
                    description: Při running lze vracet jen dokončené obchody, při done právě jeden výsledek na obchod.
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/MerchantResult" }
                  error: { type: [string, "null"], description: Neprázdné jen u failed }
        "404": { $ref: "#/components/responses/Error" }

  /alerts/{id}/resolve:
    post:
      summary: Vyřízení nálezu
      description: Změnu musí vidět API i UI. Opakované vyřízení stejného ID nevytváří další nález.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note: { type: string, description: Poznámka k vyřízení, může být prázdná }
      responses:
        "200":
          description: Vyřízeno
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { const: true }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  # ---------------------------------------------------------------------------
  # Přidané endpointy (nad rámec standardu)
  # ---------------------------------------------------------------------------
  /health:
    get:
      summary: Stav aplikace
      description: |
        Přidáno. Vrací 200, když aplikace běží a je dostupná databáze, jinak 503.
        Proč: kontrola, že kontejner po `docker compose up` opravdu nastartoval, a možnost použít ho jako healthcheck.
      responses:
        "200":
          description: Aplikace i databáze jsou v pořádku
          content:
            application/json:
              schema:
                type: object
                required: [status, blacklist_ready, blacklist_entries]
                properties:
                  status: { const: ok }
                  blacklist_ready: { type: boolean, description: "false = blacklist se ještě načítá a POST /runs vrací 503" }
                  blacklist_entries: { type: integer, description: Počet záznamů blacklistu v paměti }
        "503":
          description: Databáze není dostupná
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /alerts:
    get:
      summary: Seznam nálezů (hlavní obrazovka UI)
      description: |
        Přidáno. Vrací nálezy (obchod + škodlivá URL) se stránkováním, seřazené od naposledy viděných.
        Proč: kolega potřebuje projít všechny nevyřízené nálezy napříč obchody a běhy a vrátit se i k vyřízeným.
        Povinné `GET /runs/{run_id}` ukazuje jen výsledky jednoho běhu. Data jsou stejná jako v `alerts` u `GET /runs`.
      parameters:
        - { name: resolved, in: query, required: false, schema: { type: boolean }, description: "true = jen vyřízené, false = jen nevyřízené, bez parametru = vše" }
        - { name: merchant_id, in: query, required: false, schema: { type: string }, description: Jen nálezy daného obchodu }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 25 } }
      responses:
        "200":
          description: Stránka nálezů
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, page_size]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AlertListItem" }
                  total: { type: integer, description: Počet všech nálezů odpovídajících filtru }
                  page: { type: integer }
                  page_size: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

  /merchants:
    get:
      summary: Seznam obchodů s výsledkem poslední kontroly
      description: |
        Přidáno. Vrací obchody s výsledkem a časem poslední kontroly a s počtem nevyřízených nálezů.
        Řazení: nejdřív obchody s nevyřízenými nálezy, pak nedokončené a nedostupné (timeout, unreachable), pak OK,
        nakonec nezkontrolované.
        Proč: přehled, kde je problém a kde kontrola neproběhla. Prázdný výsledek kontroly nesmí vypadat jako „bez nálezu“.
        UI z tohoto seznamu také bere obchody pro `POST /runs`.
      parameters:
        - { name: search, in: query, required: false, schema: { type: string }, description: Část ID nebo URL obchodu (bez rozlišení velikosti písmen) }
        - name: status
          in: query
          required: false
          description: Výsledek poslední kontroly; unchecked = obchod ještě nebyl kontrolován
          schema: { type: string, enum: [ok, found, timeout, unreachable, unchecked] }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 25 } }
      responses:
        "200":
          description: Stránka obchodů
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, page_size]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MerchantListItem" }
                  total: { type: integer }
                  page: { type: integer }
                  page_size: { type: integer }
        "400": { $ref: "#/components/responses/Error" }

components:
  responses:
    Error:
      description: Chyba
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    AlertListItem:
      type: object
      description: Nález = dvojice (obchod, normalizovaná URL). `id` je stejné jako `alerts[].id` v `GET /runs/{run_id}`.
      required: [id, merchant_id, merchant_url, url, kind, blacklist_source, first_seen_at, last_seen_at, resolved, resolved_at, note, first_check_id, last_check_id]
      properties:
        id: { type: string }
        merchant_id: { type: string }
        merchant_url: { type: string, description: Úvodní stránka obchodu }
        url: { type: string, description: "Škodlivá adresa (normalizovaná), přesně shodná se záznamem blacklistu" }
        kind:
          type: string
          enum: [script, stylesheet, image, iframe, link, form, redirect, other]
          description: Kde se adresa našla (typ požadavku nebo prvku DOM), podle prvního výskytu
        blacklist_source: { type: string, description: "Zdroj záznamu blacklistu: urlhaus, urlhaus-snapshot, custom" }
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        resolved: { type: boolean }
        resolved_at: { type: [string, "null"], format: date-time, description: Kdy byl nález poprvé vyřízen }
        note: { type: string }
        first_check_id: { type: string, format: uuid }
        last_check_id: { type: string, format: uuid }

    MerchantListItem:
      type: object
      required: [id, url, last_outcome, last_error, last_duration_ms, last_check_at, open_alerts]
      properties:
        id: { type: string }
        url: { type: string }
        last_outcome:
          type: [string, "null"]
          enum: [ok, found, timeout, unreachable, null]
          description: Detailní výsledek poslední kontroly (null = nezkontrolováno). timeout a unreachable nejsou „bez nálezu“.
        last_error: { type: [string, "null"] }
        last_duration_ms: { type: [integer, "null"] }
        last_check_at: { type: [string, "null"], format: date-time }
        open_alerts: { type: integer, description: Počet nevyřízených nálezů obchodu }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }

    MerchantResult:
      type: object
      required: [merchant_id, status, matches, alerts, error]
      properties:
        merchant_id: { type: string }
        status:
          type: string
          enum: [ok, error]
          description: |
            error = HTTP chyba hlavní stránky, nedostupnost nebo překročení 10 s. Prázdné matches u chyby
            nejsou důkaz bezpečného webu.
        matches:
          type: array
          description: Unikátní absolutní URL skutečných shod s blacklistem. Zůstávají i po vyřízení nálezu.
          items: { type: string }
        alerts:
          type: array
          description: Právě jeden záznam ke každé URL v matches. Hodnoty resolved a note odpovídají aktuální evidenci.
          items:
            type: object
            required: [id, url, resolved, note]
            properties:
              id: { type: string, description: Stejný obchod + stejná URL = stejné ID napříč kontrolami }
              url: { type: string }
              resolved: { type: boolean }
              note: { type: string }
        error: { type: [string, "null"], description: Popis chyby u status = error, jinak null }
